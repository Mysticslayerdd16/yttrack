<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 260px;
      background: #0a0a0a;
      color: #f0ede8;
      font-family: 'Segoe UI', sans-serif;
      padding: 16px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .logo-dot {
      width: 24px;
      height: 24px;
      background: #e84a3a;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }
    .logo-text { font-size: 14px; font-weight: 700; }
    .logo-text span { color: #e84a3a; }
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #888;
      margin-bottom: 14px;
    }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #5cb85c; }
    .last-song {
      background: #111;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .last-label { font-size: 10px; color: #555; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 5px; }
    .last-title { font-size: 13px; font-weight: 600; color: #f0ede8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .last-channel { font-size: 11px; color: #666; margin-top: 2px; }
    .btn {
      display: block;
      width: 100%;
      height: 34px;
      border-radius: 8px;
      border: 1px solid rgba(232,74,58,0.3);
      background: rgba(232,74,58,0.1);
      color: #ff6b5b;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      line-height: 34px;
      text-decoration: none;
    }
    .btn:hover { background: #e84a3a; color: white; border-color: #e84a3a; }
  </style>
</head>
<body>
  <div class="logo">
    <div class="logo-dot">▶</div>
    <div class="logo-text">yt<span>track</span></div>
  </div>
  <div class="status">
    <div class="dot"></div>
    <span>Extension active</span>
  </div>
  <div class="last-song">
    <div class="last-label">Last tracked</div>
    <div class="last-title" id="last-title">Nothing yet</div>
    <div class="last-channel" id="last-channel">Play a song on YouTube</div>
  </div>
  <a class="btn" href="https://mysticslayerdd16.github.io/yttrack/" target="_blank">Open Dashboard ↗</a>
  <script src="popup.js"></script>
</body>
</html>
